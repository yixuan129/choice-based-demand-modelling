[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choice-based-demand-modelling"
version = "0.1.0"
description = "A synthetic, reproducible demonstration of booking-level MNL and nested-logit demand modelling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yixuan Zhang"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
app = ["streamlit>=1.32,<2"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

